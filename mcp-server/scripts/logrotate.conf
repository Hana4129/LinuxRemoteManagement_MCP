# Logrotate configuration for MCP Server
# Install: sudo cp scripts/logrotate.conf /etc/logrotate.d/linux-mcp-server
#
# Rotates audit logs and application logs daily, keeps 30 days of backups.

/opt/linux-remote-management-mcp/mcp-server/data/mcp_audit.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0600 linux-mcp linux-mcp
    postrotate
        # Signal MCP Server to reopen log file (if supported)
        # pkill -F /opt/linux-remote-management-mcp/mcp-server/data/mcp_server.pid -HUP 2>/dev/null || true
    endscript
}

/opt/linux-remote-management-mcp/mcp-server/logs/*.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0644 linux-mcp linux-mcp
}
