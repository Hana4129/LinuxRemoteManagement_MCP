# =====================================================================
# Linux Remote Management MCP Server 設定
#   server : 管理対象ノードの登録
#   console: 管理コンソール(社内Webページ)の設定
#   agent  : 各ノードのLinux Agentと通信する際の共通設定
# ルートは mcp-server/ に置いて `python -m app` から起動する前提。
# =====================================================================

console:
  host: 127.0.0.1          # 社内ネットワークからのみアクセス可なホストで listen すること
  port: 8080
  data_dir: ./data         # tokens.db (SQLite) 保存先
  auth_required: true      # 本番では管理コンソールの認証を必須にする
  auth_mode: basic         # basic または oidc
  # username/password または環境変数 LINUX_MCP_CONSOLE_USER / _PASS を必ず設定する。
  # username: admin
  # password: change-me

mcp:
  host: 127.0.0.1          # MCP利用者から到達可能な社内/VPNネットワークに限定する
  port: 8090
  path: /
  enabled: true
  stdio_token_env: LINUX_MCP_TOKEN

agent:
  timeout_seconds: 5
  tls_verify: false        # 自己署名証明書の開発環境では false にする
  user_agent: linux-mcp-server/0.1
  # Agent側の admin_token_hash と対応する秘密。管理endpointの失効同期専用。
  # admin_token: change-this-sync-secret
  # mTLS: Agent 側でクライアント証明書検証を有効にする場合に設定する
  # client_cert: ./data/client.crt
  # client_key: ./data/client.key

# ---- 管理対象ノード ----
servers:
  - id: dev-web-01
    name: "開発 Web #01"
    url: http://127.0.0.1:8443   # 開発用モックAgent (tools/mock_agent.py)
    env: development
    description: モックAgentでの動作確認用

  - id: dev-db-01
    name: "開発 DB #01"
    url: http://127.0.0.1:8444
    env: development
    description: モックAgentでの動作確認用

  - id: ubuntu-server1
    name: "Ubuntu Server #01"
    url: https://ubuntu-server1.local:9443
    env: production
    description: リモートUbuntuサーバー（Agent導入済み・token2設定）

  - id: prod-web-01
    name: "本番 Web #01"
    url: https://prod-web-01.internal:8443
    env: production
    description: 本番Webサーバー（Agent導入済み想定）

  - id: stg-batch-01
    name: "検証 Batch #01"
    url: https://stg-batch-01.internal:8443
    env: staging
