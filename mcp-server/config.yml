# =====================================================================
# Linux Remote Management MCP Server 設定
#   server : 管理対象ノードの登録
#   console: 管理コンソール(社内Webページ)の設定
#   agent  : 各ノードのLinux Agentと通信する際の共通設定
# ルートは mcp-server/ に置いて `python -m app` から起動する前提。
#
# 機密値 (password, API Key, Token等) のベストプラクティス:
#   ${ENV_VAR}        参照 : 環境変数から解決 (未設定時は起動失敗 / fail-closed)
#   ${ENV_VAR:-default} : 環境変数から解決 (未設定時は default 値)
#   これにより config.yml 自体に秘密を平文で書かずに済む。実運では
#   systemd の /etc/linux-mcp-server/env (chmod 600) または
#   Secret Manager / Vault の注入で環境変数を提供する。
#   (doc/Operations.md §6.5, scripts/env.example 参照)
# =====================================================================

console:
  host: 127.0.0.1          # 社内ネットワークからのみアクセス可なホストで listen すること
  port: 8080
  data_dir: ./data         # tokens.db (SQLite) 保存先
  auth_required: true      # 本番では管理コンソールの認証を必須にする
  auth_mode: basic         # basic または oidc
  # OIDC設定 (本番IdP例。ローカルKeycloakで試す場合は環境変数で上書き)
  # oidc_issuer: ${LINUX_MCP_OIDC_ISSUER:-https://idp.example.internal/realms/company}
  # oidc_audience: ${LINUX_MCP_OIDC_AUDIENCE:-linux-mcp-console}
  # oidc_jwks_url: ${LINUX_MCP_OIDC_JWKS_URL:-https://idp.example.internal/realms/company/protocol/openid-connect/certs}
  # oidc_client_id: ${LINUX_MCP_OIDC_CLIENT_ID:-linux-mcp-console}
  # oidc_client_secret: ${LINUX_MCP_OIDC_CLIENT_SECRET:-}
  # oidc_redirect_uri: ${LINUX_MCP_OIDC_REDIRECT_URI:-https://console.example.internal/api/auth/callback}
  # oidc_browser_login: false
  # session_cookie_secure: true  # http の IdP/コールバックで試す場合のみ false (ループバックのみ許可)
  # username/password : 環境変数 LINUX_MCP_CONSOLE_USER / _PASS で設定 (fallback あり)
  # 本番では ${ENV_VAR} 参照を推奨:  password: ${LINUX_MCP_CONSOLE_PASS}
  # username: admin
  # password: ${LINUX_MCP_CONSOLE_PASS}
  # SIEM webhook (HTTPS推奨) : 監査ログを外部SIEMへ転送 (空欄で無効)
  # siem_webhook: ${MCP_SIEM_WEBHOOK:-}
  # SIEM API Key : webhook 転送時の認証ヘッダー用 (空欄で無効)
  # siem_api_key: ${MCP_SIEM_API_KEY:-}

mcp:
  host: 127.0.0.1          # MCP利用者から到達可能な社内/VPNネットワークに限定する
  port: 8090
  path: /
  enabled: true
  stdio_token_env: LINUX_MCP_TOKEN

agent:
  timeout_seconds: 5
  tls_verify: ./certs/acemagic01-ca.crt   # 実CA署名のAgent証明書を検証 (acemagic01検証用CA)
  user_agent: linux-mcp-server/0.1
  # Agent側の admin_token_hash と対応する秘密。管理endpointの失効同期専用。
  # admin_token: ${LINUX_MCP_AGENT_ADMIN_TOKEN}
  # mTLS: Agent 側でクライアント証明書検証を有効にする場合に設定する
  client_cert: ./certs/mcp-client.crt     # acemagic01検証用 (CN=mcp-client)
  client_key: ./certs/mcp-client.key

# ---- 管理対象ノード ----
# 実環境 (2026-09-10 現在): Agent稼働ノードは acemagic01 (192.168.10.114:9443) のみ。
# モックAgent (dev-web-01/dev-db-01) は開発時のみ config.dev.yml で使用する。
servers:
  - id: acemagic01
    name: "acemagic01 (Ubuntu 24.04)"
    url: https://192.168.10.114:9443
    env: production
    description: 実環境検証用Agentホスト (mTLS有効・CA署名証明書)

