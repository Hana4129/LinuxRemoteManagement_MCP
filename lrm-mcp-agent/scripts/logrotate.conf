# Logrotate configuration for Linux Agent
# Install: sudo cp scripts/logrotate.conf /etc/logrotate.d/lrm-mcp-agent
#
# Rotates audit logs and application logs daily, keeps 30 days of backups.

/var/log/lrm-mcp-agent/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0600 lrm-mcp-agent lrm-mcp-agent
    postrotate
        # Signal Agent to reopen log file (if supported)
        # pkill -F /var/run/lrm-mcp-agent/agent.pid -HUP 2>/dev/null || true
    endscript
}
